[package]
name = "tsflowy"
version = "0.8.10"
description = "TsFlowy - 本地优先的笔记与知识管理应用"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsflowy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI 助手：OpenAI 兼容协议 + SSE 流式。
# 用 native-tls（Windows 走 Schannel），避免 rustls/openssl 带来的 cmake/nasm 构建依赖。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
# SQLite 绑定（bundled：随应用编译分发，杜绝系统库版本差异）
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# 迁移指纹：schema_migrations.checksum（SHA384(sql 字节)，沿用 sqlx 的 checksum 契约）
sha2 = "0.10"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Release 构建优化：减小二进制体积并提升运行性能
# · lto + codegen-units=1：跨 crate 内联与死代码消除
# · opt-level="s"：以体积优先（对桌面应用性能影响可忽略）
# · strip：剔除调试符号，显著缩小 exe
# · panic="abort"：不再保留展开表，进一步瘦身
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
